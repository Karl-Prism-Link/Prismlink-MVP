# Native-host Prometheus config for the split pilot.
# Run Prometheus on hpmicro so 127.0.0.1 targets reach Pipecat and hpmicro Node Exporter.
# Before use, replace replace-with-aurora-tailscale-ip with Aurora's current Tailscale IP.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: prism-link-pilot

rule_files:
  - alerts/prismlink.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          host: hpmicro

  - job_name: pipecat
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          service: prism-link-api
          host: hpmicro

  - job_name: aurora
    metrics_path: /metrics
    static_configs:
      - targets: ["replace-with-aurora-tailscale-ip:9818"]
        labels:
          service: aurora
          host: aurora

  - job_name: hpmicro-node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          host: hpmicro

  - job_name: aurora-node
    static_configs:
      - targets: ["replace-with-aurora-tailscale-ip:9100"]
        labels:
          host: aurora
