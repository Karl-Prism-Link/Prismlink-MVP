# Native-host Prometheus config for the split pilot.
# Prometheus runs on hpmicro so local PRISM LINK metrics and Aurora are scraped directly.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: prism-link-pilot

rule_files:
  - alerts/prismlink.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          host: hpmicro

  - job_name: pipecat
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          service: prism-link-api
          host: hpmicro

  - job_name: aurora
    metrics_path: /metrics
    static_configs:
      - targets: ["100.105.4.49:8088"]
        labels:
          service: aurora
          host: aurora

  - job_name: hpmicro-node
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          host: hpmicro

  - job_name: aurora-node
    static_configs:
      - targets: ["100.105.4.49:9100"]
        labels:
          host: aurora
