groups:
  - name: prism-link-availability
    rules:
      - alert: PrismLinkPipecatDown
        expr: up{job="pipecat"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "PRISM LINK API metrics endpoint is unreachable"
          runbook: "Check prism-link-api.service and localhost:8000/metrics."

      - alert: AuroraMetricsDown
        expr: up{job="aurora"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Aurora metrics endpoint is unreachable"
          runbook: "Check Aurora /metrics on 100.105.4.49:8088 and the Tailscale route."

      - alert: AuroraSipUnregistered
        expr: aurora_sip_registered == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Aurora is not registered to the SIP trunk"
          runbook: "Check SIP registration state and carrier connectivity."

      - alert: AuroraRtpNoFlow
        expr: increase(aurora_rtp_no_flow_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Aurora detected missing RTP flow"
          runbook: "Check RTP bind address, firewall/NSG, carrier media address and RTP port range."

      - alert: AuroraCallbackFailureRate
        expr: sum(rate(aurora_callback_requests_total{result=~"error|timeout"}[10m])) / clamp_min(sum(rate(aurora_callback_requests_total[10m])), 0.001) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of Aurora callbacks to Pipecat are failing"
          runbook: "Check hpmicro prism-link-api, Tailscale route and SIP event callback logs."

  - name: prism-link-hosts
    rules:
      - alert: HostDiskSpaceLow
        expr: 100 * (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} has less than 10% disk free"

      - alert: HostMemoryPressure
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} memory use is above 90%"

  - name: prism-link-quality
    rules:
      - alert: PrismLinkHighTurnLatency
        expr: histogram_quantile(0.95, sum(rate(voice_turn_latency_seconds_bucket[10m])) by (le)) > 2.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PRISM LINK caller-to-response latency p95 is above 2.5 seconds"

      - alert: PrismLinkApiErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[10m])) / clamp_min(sum(rate(http_requests_total[10m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PRISM LINK API 5xx rate is above 5%"

      - alert: PrismLinkFallbackRate
        expr: sum(rate(call_outcomes_total{outcome="fallback"}[10m])) / clamp_min(sum(rate(calls_completed_total[10m])), 0.001) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Receptionist fallback rate is above 10%"
          runbook: "Review recent failed conversations and prompt/regression-test coverage."

      - alert: PrismLinkBookingFailures
        expr: increase(booking_failures_total[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "PRISM LINK recorded a booking failure"
          runbook: "Inspect booking failure reason and reproduce with the booking regression suite."
