# Merge under the existing Prometheus scrape_configs section.
- job_name: pipecat
  metrics_path: /metrics
  static_configs:
    - targets: ["127.0.0.1:8000"]
      labels:
        service: prism-link-api
        host: hpmicro
- job_name: aurora
  static_configs:
    - targets: ["100.105.4.49:9818"]
      labels:
        service: aurora
        host: aurora
- job_name: hpmicro-node
  static_configs:
    - targets: ["127.0.0.1:9100"]
      labels:
        host: hpmicro
- job_name: aurora-node
  static_configs:
    - targets: ["100.105.4.49:9100"]
      labels:
        host: aurora
