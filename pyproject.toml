[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-link-mvp"
version = "0.4.10"
description = "Salon-first MVP for PRISM LINK"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<0.117",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "prometheus-client>=0.22,<1",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<0.29",
  "python-multipart>=0.0.20,<1",
  "email-validator>=2.2,<3",
  "cryptography>=45,<46",
  "alembic>=1.14,<2"
]

[project.optional-dependencies]
voice = [
  "pipecat-ai[deepgram,groq,openrouter,runner,silero,webrtc,websocket]>=1.0,<2",
  "websockets>=17.1",
  "python-dotenv>=1.0,<2"
]
dev = [
  "pipecat-ai[deepgram,groq,openrouter,runner,silero,webrtc,websocket]>=1.0,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Let the formatter govern wrapping; prompts and spoken copy can be long.

[tool.ruff.lint.per-file-ignores]
"apps/api/**/*.py" = ["B008"] # FastAPI dependency injection intentionally calls Depends().

[tool.setuptools.packages.find]
include = ["apps*", "core*", "database*", "services*"]
