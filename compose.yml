services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: prism_link
      POSTGRES_USER: prism
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prism -d prism_link"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - prism_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prism_postgres:
