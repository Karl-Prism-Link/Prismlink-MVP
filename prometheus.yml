global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'prism-link-pilot'

rule_files:
  - 'prometheus-alerts.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'prism-link-api'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    # /metrics requires METRICS_TOKEN. Create the file with mode 0600 containing
    # only the token, then uncomment:
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token
