name: Isolated CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [chore/publish-hpmicro-changes]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      DATABASE_URL: sqlite:///./test_prism_link.db
      JWT_SECRET_KEY: test-secret-key-that-is-long-enough
      CALENDAR_PROVIDER: mock
      RECORD_CALLS: "false"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and development test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest regression suite
        run: python -m pytest -q
